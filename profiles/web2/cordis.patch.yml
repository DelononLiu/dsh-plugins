# 独立 DSH_HOME 测试：insert 自研 host 插件（user/channel/console/my-ui）+ 独立端口
- insert:
    - id: dsh-user
      name: dsh-user
      config:
        users:
          - id: admin
            name: 管理员
            roles: [admin]
          - id: user
            name: 用户
            roles: [member]
        gatewayCookie:
          cookieName: dsh_gw_sid
          secretFile: gateway/state.json
          hmacSecret: ''
    - id: dsh-channel
      name: dsh-channel
    - id: dsh-console
      name: dsh-console
      config:
        launch:
          host1:
            host: host1
            name: 本机
            ip: 127.0.0.1
            addr: http://127.0.0.1:3089
          web4:
            host: host1
            addr: http://127.0.0.1:3084
          web3:
            host: host1
            addr: http://127.0.0.1:3083
            dshHome: /home/long2015/.dsh-web3
            profile: web3
            env:
              DSH_RELAY_AGENT: web3
          web2:
            host: host1
            addr: http://127.0.0.1:3082
            dshHome: /home/long2015/.dsh-web2
            profile: web2
            env:
              DSH_RELAY_AGENT: web2
    - id: dsh-desk
      name: dsh-desk
    - id: dsh-focus-session
      name: dsh-focus-session
    - id: dsh-focus-tabs
      name: dsh-focus-tabs
    - id: dsh-quick-nav
      name: dsh-quick-nav
- insert:
    - id: dsh-better-sidebar
      name: dsh-better-sidebar
    - id: '@linxin666/dsh-client-ui-git-graph'
      name: '@linxin666/dsh-client-ui-git-graph'
- id: webserver
  config:
    host: '127.0.0.1'
    port: 3082
- id: llm-pi-ai
  config:
    providers:
      kilo-free:
        displayName: Kilo Free (Gateway)
        apiKeyEnv: KILO_API_KEY
        api: openai-completions
        baseURL: https://api.kilo.ai/api/openrouter
        models:
          - id: cohere/north-mini-code:free
            contextWindow: 256000
          - id: dots-studio/dots-3-note-preview:free
            contextWindow: 512000
          - id: stepfun/step-3.7-flash:free
            contextWindow: 262144
      zen-free:
        displayName: OpenCode Zen (Free)
        api: openai-completions
        baseURL: https://opencode.ai/zen/v1
        # zen 免费档只认匿名：裸值 anonymous 头过 pi-ai 闸门且不被 zen 当凭证拒绝
        headers:
          authorization: anonymous
        models:
          - id: big-pickle
            contextWindow: 200000
          - id: ling-3.0-flash-fin-free
            contextWindow: 262144
